DEFAULT rain
PROMPT 0
TIMEOUT 150

UI vesamenu.c32

MENU TITLE Rain OS Core 1.3.1

LABEL rain
MENU LABEL Rain OS Core (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% archisosearchfilename=/%INSTALL_DIR%/x86_64/airootfs.sfs archisodelay=15 cow_spacesize=4G irqpoll systemd.unit=graphical.target

LABEL rain-lts
MENU LABEL Rain OS Core LTS (x86_64, BIOS, Fallback)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-lts
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% archisosearchfilename=/%INSTALL_DIR%/x86_64/airootfs.sfs archisodelay=15 cow_spacesize=4G irqpoll systemd.unit=graphical.target

LABEL rain-safe
MENU LABEL Rain OS Core Safe / Compatibility Mode (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-lts
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% archisosearchfilename=/%INSTALL_DIR%/x86_64/airootfs.sfs archisodelay=15 rootdelay=10 cow_spacesize=4G irqpoll nomodeset pci=noaer systemd.unit=graphical.target

LABEL reboot
MENU LABEL Reboot
COM32 reboot.c32

LABEL poweroff
MENU LABEL Power Off
COM32 poweroff.c32

