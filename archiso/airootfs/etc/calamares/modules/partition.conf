# Calamares Partitioning Module for Rain OS
# Defines default Btrfs subvolume layout and filesystem choices (Spec Page 45 & 49)

efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512M

defaultFileSystemType: "btrfs"
availableFileSystemTypes:
  - "btrfs"
  - "ext4"

# Standard Rain OS Btrfs subvolumes layout for atomic rollback and snapshot isolation
btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
    mountOptions:
      - "defaults"
      - "noatime"
      - "compress=zstd:1"
  - mountPoint: /home
    subvolume: /@home
    mountOptions:
      - "defaults"
      - "noatime"
      - "compress=zstd:1"
  - mountPoint: /.snapshots
    subvolume: /@snapshots
    mountOptions:
      - "defaults"
      - "noatime"
      - "compress=zstd:1"
  - mountPoint: /var/log
    subvolume: /@var_log
    mountOptions:
      - "defaults"
      - "noatime"
      - "compress=zstd:1"
  - mountPoint: /var/cache
    subvolume: /@var_cache
    mountOptions:
      - "defaults"
      - "noatime"
      - "compress=zstd:1"

# Partitioning choices for installer UI
userSwapChoices:
  - none
  - small
  - suspend
  - file

drawPartitionTable: true
alwaysShowPartitionLabels: true
initialPartitioningChoice: erase
initialSwapChoice: none
