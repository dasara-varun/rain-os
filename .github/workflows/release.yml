name: Release Rain OS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged -v /dev:/dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Keyring & Mirrors
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          echo 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          echo 'Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch' >> /etc/pacman.d/mirrorlist
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm archiso base-devel git dosfstools mtools squashfs-tools python e2fsprogs qemu-system-x86 edk2-ovmf

      - name: Compile Native C Probe
        run: |
          make -C src install DESTDIR=archiso/airootfs PREFIX=/usr/local

      - name: Validate Specification
        run: |
          chmod +x scripts/*.sh tests/*.sh repository/*.sh
          ./scripts/validate-spec.sh
          ./tests/test-syntax.sh

      - name: Build Rain OS Packages & Repository
        run: |
          ./repository/build-repo.sh

      - name: Build Rain OS Archiso
        run: |
          ./scripts/build-iso.sh

      - name: Automated QEMU Headless Smoke Boot Test
        run: |
          ISO_FILE=$(ls out/rain-os-*.iso | head -n 1)
          if [ ! -f "$ISO_FILE" ]; then
            echo "Error: ISO file not found in out/" >&2
            exit 1
          fi
          timeout 35s qemu-system-x86_64 \
            -m 2048 \
            -cdrom "$ISO_FILE" \
            -display none \
            -serial stdio \
            -vga std \
            -boot d || [ $? -eq 124 ]
          echo ":: QEMU smoke boot test passed: ISO is release-ready."

      - name: Generate Software Bill of Materials (SBOM)
        run: |
          python scripts/generate-sbom.py

      - name: Bundle Package Repository & Generate Checksums
        run: |
          echo ":: Bundling Rain OS package repository..."
          VERSION=$(grep '^iso_version=' archiso/profiledef.sh | cut -d'"' -f2)
          echo ":: Detected Rain OS version: $VERSION"
          mkdir -p out/packages
          cp repository/repo/*.pkg.tar.zst out/packages/ 2>/dev/null || true
          tar -czf "out/rain-os-packages-${VERSION}.tar.gz" -C repository/repo .
          echo ":: Copying branding assets and creating clean source archive..."
          cp branding/rain-wallpaper-4k.jpg out/
          cp branding/rain-logo-4k.png out/
          cp branding/rain-umbrella.svg out/
          git config --global --add safe.directory '*' || true
          export GIT_DISCOVERY_ACROSS_FILESYSTEM=1
          git archive --format=tar.gz --prefix="rain-os-${VERSION}/" -o "out/rain-os-${VERSION}-source.tar.gz" HEAD || tar -czf "out/rain-os-${VERSION}-source.tar.gz" --exclude='.git' --exclude='out' --exclude='work' --transform="s,^\.,rain-os-${VERSION}," .
          cd out
          find . -type f ! -name "SHA256SUMS" ! -name "SHA512SUMS" -exec sha256sum {} + | sed 's| \./| |' > SHA256SUMS
          find . -type f ! -name "SHA256SUMS" ! -name "SHA512SUMS" -exec sha512sum {} + | sed 's| \./| |' > SHA512SUMS
          echo ":: Release SHA256SUMS:"
          cat SHA256SUMS

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            out/*.iso
            out/*.tar.gz
            out/packages/*.pkg.tar.zst
            out/*.jpg
            out/*.png
            out/*.svg
            out/SHA256SUMS
            out/SHA512SUMS
            out/rain-os-sbom.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: Publish Official GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo ":: Inspecting downloaded release assets:"
          cd release-assets
          find . -mindepth 2 -type f -exec mv -t . {} +
          find . -type d -empty -delete

          for f in *; do
            if [ -f "$f" ]; then
              fsize=$(stat -c%s "$f")
              if [ "$fsize" -ge 2140000000 ]; then
                echo "Notice: $f is ${fsize} bytes (exceeds GitHub Release 2GB ceiling). Splitting into multi-part files..."
                split -b 1800M "$f" "${f}.part-"
                rm -f "$f"
              fi
            fi
          done

          echo ":: Final Release SHA256SUMS:"
          find . -type f ! -name "SHA256SUMS" ! -name "SHA512SUMS" -exec sha256sum {} + | sed 's| \./| |' > SHA256SUMS
          find . -type f ! -name "SHA256SUMS" ! -name "SHA512SUMS" -exec sha512sum {} + | sed 's| \./| |' > SHA512SUMS
          cat SHA256SUMS

          VER="${GITHUB_REF_NAME#v}"
          cat << 'EOF' > /tmp/release_notes_template.md
## Rain OS Version __VERSION__ Production Release

**Shelter from complexity, without hiding the system.**

### Official Release Assets
- `rain-os-__VERSION__-x86_64.iso`: Single bootable live installation medium with COSMIC Desktop, vertical installer Desktop & WM Selector, Omarchy Themes, Calamares installer, cosmic-store, and dual-kernel stack.
- `rain-os-__VERSION__-source.tar.gz`: Complete, clean source code repository tree for offline builds and auditable verification.
- `rain-os-packages-__VERSION__.tar.gz`: Pre-built custom Rain OS pacman package repository archive.
- `rain-wallpaper-4k.jpg`: Official 4K high-resolution default desktop wallpaper (3840x2160).
- `rain-logo-4k.png`: Official 4K transparent branding emblem (3840x2160).
- `rain-umbrella.svg`: Scalable vector emblem and application icon.
- `rain-os-sbom.json`: Full CycloneDX v1.5 Software Bill of Materials cataloging all bundled software and open-source licenses.
- `SHA256SUMS` & `SHA512SUMS`: Cryptographic integrity checksums for all release files.

### Key Included Capabilities
- **COSMIC Desktop Session by Default**: Modern, rust-based flagship desktop with auto-tiling, Wayland layer-shell panels, and sub-300MB idle memory.
- **Vertical Installation Desktop & WM Selector**: Interactive vertical selector inside the installer supporting COSMIC, Hyprland, KDE Plasma 6, GNOME, i3-wm, Sway, XFCE4, Niri, River, and Gamescope.
- **Universal Software Center (`cosmic-store`)**: Fast GUI application manager integrating native packages and Flatpaks without database locking.
- **Clean Live Boot Surface**: Only installer and learning hub shortcuts displayed; zero intrusive auto-spawning popups.
- **Dedicated Application Iconography**: Unique vector-derived icons across all 8 Rain OS custom utilities.
- **Omarchy Themes Engine**: 22 signature themes adapted from `omacom/omarchy` with unified palettes.
- **12 Pristine 4K Wallpapers**: Razor-sharp, watermark-free UHD wallpapers matching Rain OS aesthetic.
- **Hardware Driver Stack**: Intel, AMD, Realtek, Broadcom Wi-Fi/Bluetooth, and dual-kernel stability (`linux` + `linux-lts`).
- **C Native Engine**: Compiled C system and display probe (`rain-probe`) with sub-millisecond execution.
- **Btrfs Snapshot Safety**: Automatic pre-upgrade snapshots (`00-rain-pre-snapshot.hook`), preflight health checks, and rollback utilities.

### Verification
Verify cryptographic integrity before flashing:
```bash
sha256sum -c SHA256SUMS
sha512sum -c SHA512SUMS
```
EOF
          sed "s/__VERSION__/$VER/g" /tmp/release_notes_template.md > /tmp/release_notes.md

          if ls *.part-* 1> /dev/null 2>&1; then
            cat << 'PARTEOF' >> /tmp/release_notes.md

### Reassembling Multi-Part ISO
Due to GitHub Release's 2.0 GiB ceiling per asset, large images are provided as multi-part assets:
- **Linux / macOS**:
  ```bash
  cat rain-os-*.iso.part-* > rain-os-assembled.iso
  sha256sum -c SHA256SUMS
  ```
- **Windows (PowerShell / Command Prompt)**:
  ```cmd
  copy /b rain-os-*.iso.part-aa + rain-os-*.iso.part-ab rain-os-assembled.iso
  ```
PARTEOF
          fi

          mapfile -t ASSETS < <(find . -type f)
          echo ":: Publishing ${#ASSETS[@]} release asset(s) to $GITHUB_REPOSITORY ($GITHUB_REF_NAME)..."
          gh release delete "$GITHUB_REF_NAME" --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Rain OS $GITHUB_REF_NAME" \
            --notes-file /tmp/release_notes.md \
            --verify-tag || gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          echo ":: Successfully published GitHub Release $GITHUB_REF_NAME"
