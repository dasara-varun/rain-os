name: Release Rain OS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged -v /dev:/dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Keyring & Mirrors
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          echo 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          echo 'Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch' >> /etc/pacman.d/mirrorlist
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm archiso base-devel git dosfstools mtools squashfs-tools python e2fsprogs qemu-system-x86 edk2-ovmf

      - name: Compile Native C Probe
        run: |
          make -C src install DESTDIR=archiso/airootfs PREFIX=/usr/local

      - name: Validate Specification
        run: |
          chmod +x scripts/*.sh tests/*.sh repository/*.sh
          ./scripts/validate-spec.sh
          ./tests/test-syntax.sh

      - name: Build Rain OS Packages & Repository
        run: |
          ./repository/build-repo.sh

      - name: Build Rain OS Archiso
        run: |
          ./scripts/build-iso.sh

      - name: Automated QEMU Headless Smoke Boot Test
        run: |
          ISO_FILE=$(ls out/rain-os-*.iso | head -n 1)
          if [ ! -f "$ISO_FILE" ]; then
            echo "Error: ISO file not found in out/" >&2
            exit 1
          fi
          timeout 35s qemu-system-x86_64 \
            -m 2048 \
            -cdrom "$ISO_FILE" \
            -display none \
            -serial stdio \
            -vga std \
            -boot d || [ $? -eq 124 ]
          echo ":: QEMU smoke boot test passed: ISO is release-ready."

      - name: Generate Software Bill of Materials (SBOM)
        run: |
          python scripts/generate-sbom.py

      - name: Bundle Package Repository & Generate Checksums
        run: |
          echo ":: Bundling Rain OS package repository..."
          VERSION=$(grep '^iso_version=' archiso/profiledef.sh | cut -d'"' -f2)
          echo ":: Detected Rain OS version: $VERSION"
          mkdir -p out/packages
          cp repository/repo/*.pkg.tar.zst out/packages/ 2>/dev/null || true
          tar -czf "out/rain-os-packages-${VERSION}.tar.gz" -C repository/repo .
          echo ":: Copying branding assets and creating clean source archive..."
          cp branding/rain-wallpaper-4k.jpg out/
          cp branding/rain-logo-4k.png out/
          cp branding/rain-umbrella.svg out/
          git config --global --add safe.directory '*' || true
          export GIT_DISCOVERY_ACROSS_FILESYSTEM=1
          git archive --format=tar.gz --prefix="rain-os-${VERSION}/" -o "out/rain-os-${VERSION}-source.tar.gz" HEAD || tar -czf "out/rain-os-${VERSION}-source.tar.gz" --exclude='.git' --exclude='out' --exclude='work' --transform="s,^\.,rain-os-${VERSION}," .
          cd out
          find . -type f ! -name "SHA256SUMS" ! -name "SHA512SUMS" -exec sha256sum {} + | sed 's| \./| |' > SHA256SUMS
          find . -type f ! -name "SHA256SUMS" ! -name "SHA512SUMS" -exec sha512sum {} + | sed 's| \./| |' > SHA512SUMS
          echo ":: Release SHA256SUMS:"
          cat SHA256SUMS

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            out/*.iso
            out/*.tar.gz
            out/packages/*.pkg.tar.zst
            out/*.jpg
            out/*.png
            out/*.svg
            out/SHA256SUMS
            out/SHA512SUMS
            out/rain-os-sbom.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: Publish Official GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo ":: Inspecting downloaded release assets:"
          cd release-assets
          echo ":: Final Release SHA256SUMS:"
          find . -type f ! -name "SHA256SUMS" ! -name "SHA512SUMS" -exec sha256sum {} + | sed 's| \./| |' > SHA256SUMS
          find . -type f ! -name "SHA256SUMS" ! -name "SHA512SUMS" -exec sha512sum {} + | sed 's| \./| |' > SHA512SUMS
          cat SHA256SUMS

          cat << EOF > /tmp/release_notes.md
          ## Rain OS Version ${GITHUB_REF_NAME#v} Production Release

          **Shelter from complexity, without hiding the system.**

          ### Official Release Assets
          - \`rain-os-${GITHUB_REF_NAME#v}-x86_64.iso\`: Single bootable live installation medium with Plasma 6 Desktop, CachyOS-style Desktop & WM Selector, Omarchy Themes, Calamares installer, and dual-kernel stack.
          - \`rain-os-${GITHUB_REF_NAME#v}-source.tar.gz\`: Complete, clean source code repository tree for offline builds and auditable verification.
          - \`rain-os-packages-${GITHUB_REF_NAME#v}.tar.gz\`: Pre-built custom Rain OS pacman package repository archive.
          - `rain-wallpaper-4k.jpg`: Official 4K high-resolution default desktop wallpaper (3840x2160).
          - `rain-logo-4k.png`: Official 4K transparent branding emblem (3840x2160).
          - `rain-umbrella.svg`: Scalable vector emblem and application icon.
          - `rain-os-sbom.json`: Full CycloneDX v1.5 Software Bill of Materials cataloging all bundled software and open-source licenses.
          - `SHA256SUMS` & `SHA512SUMS`: Cryptographic integrity checksums for all release files.

          ### Key Included Capabilities
          - **CachyOS-Style Desktop & WM Selector**: Interactive graphical and CLI switcher (`rain-desktop-selector`) supporting KDE Plasma 6, Hyprland, GNOME Shell, i3-wm, Sway, Niri, River, Gamescope+MangoHUD, COSMIC Desktop, and XFCE4.
          - **Omarchy Themes Engine**: 22 signature themes adapted from `omacom/omarchy` with unified palettes across Hyprland, Waybar, Rofi, Alacritty, and desktop settings.
          - **12 Pristine 4K Anime Wallpapers**: Razor-sharp, watermark-free, borderless 3840x2160 UHD wallpapers matching Rain OS aesthetic and Omarchy themes.
          - **Universal Software Center**: KDE Discover, Flathub Flatpak integration, native AppImage execution (FUSE2), and Windows Compatibility Bridge (Bottles, Wine, Steam Proton, Quickemu).
          - **Multi-Screen & Devices**: Multi-monitor assistant (`rain-display-manager`), fractional DPI scaling, KDE Connect phone pairing (Android/iOS), Bluetooth, and Avahi/Samba local network discovery.
          - **Hardware Driver Stack**: Comprehensive drivers for NVIDIA, AMD Radeon, Intel Iris/Arc, and legacy fallback displays (`xf86-video-vesa`, `fbdev`), broad Wi-Fi chipsets, and dual-kernel stability (`linux` + `linux-lts`).
          - **C Native Engine**: Compiled C system and display probe (`rain-probe`) with sub-millisecond execution.
          - **Btrfs Snapshot Safety**: Automatic pre-upgrade snapshots (`00-rain-pre-snapshot.hook`), preflight health checks, and rollback utilities.

          ### Verification
          Verify cryptographic integrity before flashing:
          ```bash
          sha256sum -c SHA256SUMS
          sha512sum -c SHA512SUMS
          ```
          EOF

          mapfile -t ASSETS < <(find . -type f)
          echo ":: Publishing ${#ASSETS[@]} release asset(s) to $GITHUB_REPOSITORY ($GITHUB_REF_NAME)..."
          gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Rain OS $GITHUB_REF_NAME" \
            --notes-file /tmp/release_notes.md \
            --verify-tag || gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          echo ":: Successfully published GitHub Release $GITHUB_REF_NAME"
