name: Build Rain OS ISO

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged -v /dev:/dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Keyring & Mirrors
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          echo 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          echo 'Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch' >> /etc/pacman.d/mirrorlist
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm archiso base-devel git dosfstools mtools squashfs-tools python e2fsprogs qemu-system-x86 edk2-ovmf

      - name: Compile Native C Probe
        run: |
          make -C src install DESTDIR=archiso/airootfs PREFIX=/usr/local

      - name: Validate Specification
        run: |
          chmod +x scripts/*.sh tests/*.sh repository/*.sh
          ./scripts/validate-spec.sh
          ./tests/test-syntax.sh

      - name: Build Rain OS Packages & Repository
        run: |
          ./repository/build-repo.sh

      - name: Build Rain OS Archiso
        run: |
          ./scripts/build-iso.sh

      - name: Automated QEMU Headless Smoke Boot Test
        run: |
          echo ":: Starting QEMU headless smoke boot test on built ISO..."
          ISO_FILE=$(ls out/rain-os-*.iso | head -n 1)
          if [ ! -f "$ISO_FILE" ]; then
            echo "Error: ISO file not found in out/" >&2
            exit 1
          fi
          # Boot with QEMU for 35 seconds to verify kernel and initramfs load cleanly without panic
          timeout 35s qemu-system-x86_64 \
            -m 2048 \
            -cdrom "$ISO_FILE" \
            -display none \
            -serial stdio \
            -vga std \
            -boot d || [ $? -eq 124 ]
          echo ":: QEMU smoke boot test passed: ISO boots and kernel initializes successfully."

      - name: Generate Software Bill of Materials (SBOM)
        run: |
          python scripts/generate-sbom.py

      - name: Bundle Package Repository & Generate Checksums
        run: |
          echo ":: Bundling Rain OS package repository..."
          VERSION=$(grep '^iso_version=' archiso/profiledef.sh | cut -d'"' -f2)
          echo ":: Detected Rain OS version: $VERSION"
          mkdir -p out/packages
          cp repository/repo/*.pkg.tar.zst out/packages/ 2>/dev/null || true
          tar -czf "out/rain-os-packages-${VERSION}.tar.gz" -C repository/repo .
          echo ":: Copying branding assets and creating clean source archive..."
          cp branding/rain-wallpaper-4k.jpg out/
          cp branding/rain-logo-4k.png out/
          cp branding/rain-umbrella.svg out/
          git config --global --add safe.directory '*' || true
          export GIT_DISCOVERY_ACROSS_FILESYSTEM=1
          git archive --format=tar.gz --prefix="rain-os-${VERSION}/" -o "out/rain-os-${VERSION}-source.tar.gz" HEAD || tar -czf "out/rain-os-${VERSION}-source.tar.gz" --exclude='.git' --exclude='out' --exclude='work' --transform="s,^\.,rain-os-${VERSION}," .
          cd out
          find . -type f ! -name "SHA256SUMS" ! -name "SHA512SUMS" -exec sha256sum {} + | sed 's| \./| |' > SHA256SUMS
          find . -type f ! -name "SHA256SUMS" ! -name "SHA512SUMS" -exec sha512sum {} + | sed 's| \./| |' > SHA512SUMS
          echo ":: Artifact SHA256SUMS:"
          cat SHA256SUMS

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rain-os-iso
          path: |
            out/*.iso
            out/*.tar.gz
            out/packages/*.pkg.tar.zst
            out/*.jpg
            out/*.png
            out/*.svg
            out/SHA256SUMS
            out/SHA512SUMS
            out/rain-os-sbom.json
          if-no-files-found: error
          retention-days: 14

