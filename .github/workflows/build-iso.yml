name: Build Rain OS ISO

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Keyring & Install Build Dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm archiso base-devel git dosfstools mtools squashfs-tools python

      - name: Validate Specification
        run: |
          chmod +x scripts/*.sh tests/*.sh
          ./scripts/validate-spec.sh
          ./tests/test-syntax.sh

      - name: Build Rain OS Archiso
        run: |
          ./scripts/build-iso.sh

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rain-os-iso
          path: |
            out/*.iso
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
